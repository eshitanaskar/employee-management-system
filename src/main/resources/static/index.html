<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Dashboard Header -->
    <header class="dashboard-header">
        <div>
            <h1>Employee Management System</h1>
            <p>Manage your employees easily</p>
        </div>
        <span class="admin-label">Admin Dashboard</span>
    </header>

    <!-- Dashboard Statistics -->
    <section class="dashboard-stats">

        <div class="dashboard-card">
            <h3>Total Employees</h3>
            <h1 id="totalEmployees">0</h1>
        </div>

        <div class="dashboard-card">
            <h3>Total Departments</h3>
            <h1 id="totalDepartments">0</h1>
        </div>

        <div class="dashboard-card">
            <h3>Average Salary</h3>
            <h1 id="averageSalary">0</h1>
        </div>

    </section>

    <!-- Add Employee Section -->
    <section class="form-section">

        <h2>Add New Employee</h2>

        <form id="employeeForm">

            <input type="number" id="id" placeholder="Employee ID" required>

            <input type="text" id="name" placeholder="Employee Name" required>

            <input type="text" id="department" placeholder="Department" required>

            <input type="number" id="salary" placeholder="Salary" required>

            <button type="submit">Add Employee</button>

        </form>

    </section>

    <!-- Employee List Section -->
    <section class="employee-section">

        <h2>Employee List</h2>

        <input type="text" id="search" placeholder="Search employee by name">

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                </tbody>

            </table>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
